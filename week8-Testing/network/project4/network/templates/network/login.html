{% extends "network/layout.html" %}

{% block body %}
    <div class="authenticate-layout">
        <h2 class="authenticate-headers">Login</h2>

        {% if message %}
            <div>{{ message }}</div>
        {% endif %}

        <form action="{% url 'login' %}" method="post" autocomplete="off">
            {% csrf_token %}
            <div class="form-group">
                <input autofocus class="form-control" type="text" name="username" placeholder="Username">
            </div>
            <div class="form-group">
                <input class="form-control" type="password" name="password" placeholder="Password">
            </div>
            <div class="form-group">
                <input class="authenticate-headers login" type="submit" value="Login">
            </div>
        </form>
        <div class="authenticate-headers">Don't have an account? <a href="{% url 'register' %}" class="authenticate-headers">Register here.</a></div>
    </div>
{% endblock %}
